# DROPZONE - coturn configuration template (RFC 5766 relay for WebRTC).
#
# This file is a TEMPLATE: infra/coturn/entrypoint.sh substitutes the __VARS__
# below from the container environment and writes /tmp/turnserver.conf, which is
# what coturn actually reads. For a bare-metal install render it yourself:
#
#   TURN_SECRET=... EXTERNAL_IP=... sh infra/coturn/entrypoint.sh
#   # or: turnserver -c /etc/turnserver.conf
#
# Credentials: the signaling service mints short-lived REST credentials
# (protocol 1.4) signed with the same static-auth-secret. There is no
# per-device password database to rotate.

# --- listeners ----------------------------------------------------------------
# Plain STUN/TURN on UDP and TCP. TCP/3478 is the fallback for networks that drop
# UDP outright; it is what makes locked-down corporate wifi work.
listening-port=__LISTEN_PORT__

# TURN over TLS and DTLS on 5349. Needs cert=/pkey= (or --cert/--pkey, which the
# entrypoint adds when infra/coturn/certs has a key pair).
tls-listening-port=__TLS_PORT__

# Public address clients must see in ICE candidates. Empty means 'detect it'.
# Set public-ip/private-ip form when the host is behind 1:1 NAT.
external-ip=__EXTERNAL_IP__

# Relay allocation range. Open exactly this UDP range in the firewall: each
# relayed flow occupies one port until its allocation expires.
min-port=__MIN_PORT__
max-port=__MAX_PORT__

# --- authentication ------------------------------------------------------------
# Short-lived credentials only, computed from the shared secret below:
#   username   = "<expiry-unix>:<deviceId>"
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
use-auth-secret
static-auth-secret=__TURN_SECRET__

# Realm advertised in the 401 challenge. Keep it stable across restarts so
# clients see one server identity.
realm=__REALM__

# --- hardening ------------------------------------------------------------------
# Add a MESSAGE-INTEGRITY fingerprint to every response (RFC 5389).
fingerprint

# Never relay to multicast destinations (amplification guard).
no-multicast-peers

# No telnet-style admin CLI on 5766.
no-cli

# RFC 5780 mobility lets a client keep an allocation while its address changes;
# not wanted here, so it is disabled.
no-mobility

# SSRF hardening: uncomment to refuse relaying into private or loopback space.
# Left off by default because this app relays between devices on the same LAN.
#no-loopback-peers
#denied-peer-ip=10.0.0.0-10.255.255.255
#denied-peer-ip=172.16.0.0-172.31.255.255
#denied-peer-ip=192.168.0.0-192.168.255.255

# Reject stale nonces after 600 s instead of the 3600 s default.
stale-nonce=600

# Quotas: one device cannot exhaust the relay.
user-quota=12
total-quota=1200

# --- connectivity ----------------------------------------------------------------
# UDP and TCP relay both stay enabled so restrictive networks still work.
#no-tcp-relay

# --- logging ----------------------------------------------------------------------
# Log to stdout only: 'docker compose logs -f coturn' and journald both work.
log-file=stdout
# Single-line records with timestamps; nothing to rotate inside the container.
simple-log
# 'warning' keeps normal traffic invisible while surfacing auth/TLS failures.
verbose

# TLS material for TURN over TLS. The entrypoint passes --cert/--pkey when these
# files exist and falls back to --no-tls --no-dtls when they do not.
#cert=/etc/coturn/certs/turn.crt
#pkey=/etc/coturn/certs/turn.key
